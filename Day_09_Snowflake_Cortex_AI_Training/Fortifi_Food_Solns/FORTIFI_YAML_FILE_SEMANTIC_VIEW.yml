          - depot
          - facility
          - office
          - place
          - plant
          - premises
          - venue
          - warehouse
        description: The geographical location or site where a purchase was made.
        expr: '"Site"'
        data_type: VARCHAR(16777216)
        sample_values:
          - CAQC
          - DKTA
          - EU
      - name: U_M
        synonyms:
          - measurement_unit
          - measurement_unit_code
          - unit_measurement
          - unit_of_measure
