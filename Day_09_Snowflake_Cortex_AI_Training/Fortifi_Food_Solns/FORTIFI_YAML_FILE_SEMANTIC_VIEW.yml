        expr: CAST(TRY_TO_TIMESTAMP(NULLIF("Received Date/Time", ''),'DD-MM-YYYY HH24:MI') AS DATE)
        data_type: VARCHAR(16777216)
        sample_values:
          - '2025-12-18'
          - '2025-02-11'
          - '2026-03-03'
        is_enum: false
      - name: SITE
        synonyms:
