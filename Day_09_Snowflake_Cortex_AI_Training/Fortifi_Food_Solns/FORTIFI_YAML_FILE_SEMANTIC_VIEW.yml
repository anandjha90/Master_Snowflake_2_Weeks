    use_as_onboarding_question: false
  - name: '"What is the average delivery time in days for each destination type year to date?"'
    sql: |-
      SELECT
        destination_type,
        AVG(delivery_time_days) AS avg_delivery_time_days
      FROM
        fact_purchasing_report_copy
      WHERE
        release_date >= DATE_TRUNC('YEAR', CURRENT_DATE)
        AND release_date <= CURRENT_DATE
      GROUP BY
        destination_type
      ORDER BY
        avg_delivery_time_days DESC NULLS LAST
