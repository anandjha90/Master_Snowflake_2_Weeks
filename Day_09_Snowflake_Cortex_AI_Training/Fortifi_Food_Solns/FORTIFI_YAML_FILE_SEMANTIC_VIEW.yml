verified_queries:
  - name: '"What is the total inventory value for each site?"'
    sql: |-
      SELECT
        site,
        MIN(site) AS start_date,
        MAX(site) AS end_date,
        SUM(inventory_value) AS total_inventory_value
      FROM
        fact_erp_info_copy
      GROUP BY
        site
      ORDER BY
        total_inventory_value DESC NULLS LAST
        /* Generated by Cortex Analyst (request_id: 83534156-952c-44ea-821f-3f4eea767200) */
    question: What is the total inventory value for each site?
    verified_at: 1783696647
    verified_by: CORTEX_SVC_USER
    use_as_onboarding_question: false
  - name: '"How many units were ordered for each currency code in the last month?"'
    sql: |-
      SELECT
        currency_code,
        SUM(qty_ordered) AS total_units_ordered
      FROM
        fact_purchasing_report_copy
      WHERE
        release_date >= DATE_TRUNC('MONTH', CURRENT_DATE - INTERVAL '1 MONTH')
        AND release_date < DATE_TRUNC('MONTH', CURRENT_DATE)
      GROUP BY
        currency_code
      ORDER BY
        total_units_ordered DESC NULLS LAST
        /* Generated by Cortex Analyst (request_id: 59bb3695-2bb7-482b-91a7-280ac14a4f68) */
    question: How many units were ordered for each currency code in the last month?
