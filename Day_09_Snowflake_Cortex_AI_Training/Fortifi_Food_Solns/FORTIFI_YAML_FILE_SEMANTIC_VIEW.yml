          - PCE
      - name: VENDOR_VEND_NUM
        synonyms:
          - merchant_number
          - provider_number
          - seller_id
          - supplier_id
          - trader_id
          - vendor_identifier
          - vendor_number
        description: The name of the vendor along with their corresponding vendor number.
        expr: '"Vendor - Vend Num"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Motion NZ Limited - SAECO AKL
          - Elcee Holland BV - 500519
          - CHICAGO CHAIN & TRANSMISSION - 001400
    time_dimensions:
