name: DEV_ANALYTICS_SEMANTIC_VW
tables:
  - name: FACT_ERP_INFO_COPY
    synonyms:
      - Enterprise Resource Planning Data
      - ERP Information
      - Inventory Details
      - Item Master Data
      - Logistics Data
      - Material Master Data
      - Procurement Information
      - Product Information
      - Supply Chain Information
    description: The table contains records of product information. Each record represents a single item and includes details about its description, classification, procurement, and cost. The records cover various product categories and include information about vendors, lead times, and inventory management.
    base_table:
      database: DEV_ANALYTICS_TW
      schema: DEV_ANALYTICS_SCHEMA
      table: FACT_ERP_INFO_COPY
    dimensions:
      - name: ABC_CODE_DESCRIPTION
        synonyms:
          - abc_category
          - abc_classification
          - abc_code_meaning
          - abc_label
          - inventory_category_description
          - inventory_classification
        description: A brief description of the ABC code.
        expr: '"ABC Code - Description"'
        data_type: VARCHAR(16777216)
      - name: BUYER_DESCRIPTION
        synonyms:
          - buyer_name
          - buyer_title
          - procurement_description
          - procurement_manager
          - procurement_officer
          - procurement_specialist
          - purchaser_description
          - purchasing_agent
        description: The name or description of the buyer.
        expr: '"Buyer - Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Paul Witbreuk
          - Angie Farmer
      - name: COUNTRY_OF_ORIGIN
        synonyms:
          - country_of_manufacture
          - country_of_production
          - country_of_source
          - manufacturing_country
          - origin_country
          - production_country
          - source_country
        description: The country where the item originated from.
        expr: '"Country Of Origin"'
        data_type: VARCHAR(16777216)
        sample_values:
          - CZECH REPUBLIC
          - NEW ZEALAND
      - name: FAMILY_CODE_DESCRIPTION
        synonyms:
          - family_category_description
          - family_classification_description
          - family_code_name
          - family_group_description
          - product_family_description
        description: A description of the family code.
        expr: '"Family Code - Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - COMPOSANTS ELECTRIQUES DETAILS
          - 3SPECIAL
          - 5PROD
      - name: HTS_CODE
        synonyms:
          - commodity_code
          - customs_code
          - export_code
          - harmonized_system_code
          - harmonized_tariff_schedule
          - hts
          - import_code
          - tariff_code
          - trade_code
        description: Harmonized Tariff Schedule codes used to classify internationally traded products.
        expr: '"HTS Code"'
        data_type: VARCHAR(16777216)
        sample_values:
          - '84314980'
          - 8438.90.9060
          - '84199000'
      - name: ITEM
        synonyms:
          - article
          - commodity
          - entity
          - goods
          - inventory_item
          - merchandise
          - object
          - product
          - stock
          - unit
        description: Unique identifiers for items.
        expr: '"Item"'
        data_type: VARCHAR(16777216)
        sample_values:
          - 4590039651-y
          - CRC 3076 Degreasert XD8
          - 1-048685
      - name: ITEM_DESCRIPTION
        synonyms:
          - item_details
          - item_info
          - item_specification
          - product_description
          - product_info
          - product_specification
        description: A brief description of the item.
        expr: '"Item Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Reserve 4" x 4" Tubing
          - PROX MOUNT-HANDED
          - Cable Tray
      - name: ITEM_STATUS_DESCRIPTION
        synonyms:
          - inventory_condition
          - inventory_status
          - item_condition
          - item_state
          - item_status
          - product_condition
          - product_status
          - stock_status
        description: A description of the status of an item.
        expr: '"Item Status - Description"'
        data_type: VARCHAR(16777216)
      - name: LEVEL_1
        synonyms:
          - category_1
          - first_level
          - first_tier
          - level_one
          - main_category
          - primary_level
          - tier_1
          - top_level
        description: A high-level categorization of the data.
        expr: '"Level 1"'
        data_type: VARCHAR(16777216)
        sample_values:
          - VMI
          - '302'
      - name: LEVEL_2_DESCRIPTION
        synonyms:
          - level_two_de
          - level_two_label
          - level_two_name
          - second_level_label
          - secondary_category_description
          - secondary_level_description
        description: A detailed description of the product or component at the second level of categorization.
        expr: '"Level 2 Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Chain & sprockets
          - Hydraulics
          - Vision
      - name: LEVEL_3_DESCRIPTION
        synonyms:
          - level_three_category
          - subcategory_level_three
          - tertiary_level_name
          - third_level_description
          - third_tier_description
        description: A detailed description of a product or component at the third level of categorization.
        expr: '"Level 3 Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Lighting & optics (LED ring lights, backlights, bar lights, structured light projectors, lasers, Lenses, filters (polarizing,IR,etc.))
          - Pipes (rectagle, round, square)
          - Gearbox
      - name: PLANNER_CODE_DESCRIPTION
        synonyms:
          - logistics_code_description
          - planner_name
          - planner_title
          - planning_code_description
          - planning_manager_description
          - planning_owner
          - planning_responsible
          - procurement_planner_description
          - supply_chain_planner_description
        description: A brief description of the planner code.
        expr: '"Planner Code - Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - OSS
          - '302'
          - CO
      - name: PMT_CODE_DESCRIPTION
        synonyms:
          - payment_code_info
          - payment_method_description
          - payment_method_info
          - payment_type_description
          - payment_type_info
        description: Payment method descriptions.
        expr: '"PMT Code - Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Direct
      - name: PRODUCT_CODE_DESCRIPTION
        synonyms:
          - product_category
          - product_code_name
          - product_group_description
          - product_identifier_description
          - product_label_description
        description: Product codes and their corresponding descriptions.
        expr: '"Product Code - Description"'
        data_type: VARCHAR(16777216)
        sample_values:
          - PYMCOM1201 - Commodity Parts, General, Cantrell
          - PYMCOM1230 - Purchased Parts, Distributor
      - name: RANK_1_VENDOR
        synonyms:
          - first_choice_vendor
          - lead_vendor
          - main_provider
          - preferred_vendor
          - primary_vendor
          - top_supplier
        description: The name of the primary vendor.
        expr: '"Rank 1 Vendor"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Pajo Bolte A/S - 500676
          - Frontmatec (Jining) Co., Ltd - 501048
          - Frontmatec Tandslet A/S - 500003
      - name: SITE
        synonyms:
          - branch
          - depot
          - establishment
          - facility
          - location
          - office
          - plant
          - premises
          - warehouse
        description: The name or identifier of a specific location or facility.
        expr: '"Site"'
        data_type: VARCHAR(16777216)
        sample_values:
          - DKTA
          - Mokena
          - Flawil
      - name: UNIT_OF_MEASURE
        synonyms:
          - measurement_type
          - measurement_unit
          - quantity_unit
          - unit_description
          - unit_of_measurement
          - unit_type
          - uom
        description: Units of measurement for quantities, such as each, piece, or item.
        expr: '"Unit of Measure"'
        data_type: VARCHAR(16777216)
        sample_values:
          - UN
          - EA
          - P
    facts:
      - name: INVENTORY_TURNS
        synonyms:
          - inventory_rotation
          - inventory_turnover_rate
          - stock_turnover
          - stock_turnover_rate
          - stock_turns
        description: The number of times inventory is sold and replaced within a given period.
        expr: '"Inventory Turns"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: INVENTORY_VALUE
        synonyms:
          - inventory_total_value
          - inventory_worth
          - stock_value
          - stock_worth
          - total_inventory_cost
          - total_stock_value
        description: The total monetary value of inventory.
        expr: '"Inventory Value"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: ITEM_S_LEAD_TIME
        synonyms:
          - item_arrival_time
          - item_delivery_time
          - item_lead_time
          - item_procurement_time
          - item_replenishment_time
          - item_supply_time
          - item_wait_time
          - lead_time_for_items
        description: The time it takes for an item to be delivered or produced after it has been ordered.
        expr: '"Item''s Lead Time"'
        data_type: NUMBER(38,8)
        access_modifier: public_access
        sample_values:
          - '79.00000000'
          - '80.00000000'
          - '35.00000000'
      - name: LEVEL_2
        synonyms:
          - intermediate_level
          - level_two
          - mid_level
          - middle_level
          - second_level
          - secondary_level
          - sub_level
          - tier_2
        description: A level of categorization or classification, likely indicating a specific tier or ranking.
        expr: '"Level 2"'
        data_type: NUMBER(38,5)
        access_modifier: public_access
        sample_values:
          - '118.00000'
          - '103.00000'
          - '114.00000'
      - name: LEVEL_3
        synonyms:
          - level_three
          - subcategory_three
          - tertiary_level
          - third_category
          - third_hierarchy_level
          - third_level
        description: A hierarchical level of categorization.
        expr: '"Level 3"'
        data_type: NUMBER(38,5)
        access_modifier: public_access
        sample_values:
          - '221.00000'
          - '178.00000'
          - '2.00000'
      - name: MINIMUM_ORDER_QUANTITY
        synonyms:
          - min_order_quantity
          - minimum_batch_size
          - minimum_order_amount
          - minimum_purchase_quantity
          - order_threshold
          - reorder_quantity
        description: The minimum quantity of an item that must be ordered.
        expr: '"Minimum Order Quantity"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: MONTHS_ON_HAND
        synonyms:
          - inventory_duration
          - inventory_months
          - inventory_period
          - months_of_inventory
          - months_of_stock
          - stock_duration
        description: The number of months for which inventory is expected to last.
        expr: '"Months On Hand"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: NETTABLE_QTY_ON_HAND
        expr: '"Nettable Qty On Hand"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_AVAILABLE
        expr: '"Qty Available"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_BACKLOG_ON_JOB_ORDERS
        expr: '"Qty Backlog on Job Orders"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_BACKLOG_ON_PO
        expr: '"Qty Backlog On PO"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_CONSUMED_ON_THE_LAST_12_MONTHS
        expr: '"Qty consumed on the Last 12 Months"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_CONSUMED_ON_THE_LAST_18_MONTHS
        expr: '"Qty consumed on the Last 18 Months"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_CONSUMED_ON_THE_LAST_24_MONTHS
        expr: '"Qty consumed on the Last 24 Months"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_CONSUMED_ON_THE_LAST_3_MONTHS
        expr: '"Qty consumed on the Last 3 Months"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: QTY_CONSUMED_ON_THE_LAST_6_MONTHS
        expr: '"Qty consumed on the Last 6 Months"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: REORDER_POINT
        expr: '"Reorder Point"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: SAFETY_STOCK
        expr: '"Safety Stock"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: STANDARD_INSIDE_OPERATIONS_COST
        expr: '"Standard Inside Operations Cost"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: STANDARD_MATERIAL_ONLY_COST
        expr: '"Standard Material Only Cost"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: STANDARD_OUTSIDE_OPERATIONS_COST
        expr: '"Standard Outside Operations Cost"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
      - name: STANDARD_TOTAL_UNIT_COST
        synonyms:
          - average_unit_cost
          - standard_cost_per_unit
          - standard_item_cost
          - total_cost_per_item
          - total_item_price
          - total_unit_cost
          - unit_price
        description: The total cost of a standard unit.
        expr: '"Standard Total Unit Cost"'
        data_type: NUMBER(18,4)
        access_modifier: public_access
    metrics:
      - name: site_end_date
        description: Identifies the latest site value within a group, typically used as a proxy for the end date in site-based inventory analysis. Use when questions ask about 'end date', 'latest site', or 'end of inventory period' for each site. Helps define the reporting period for inventory metrics, allowing users to see the closing timeframe for inventory value or other site-based measures.
        expr: MAX(site)
      - name: site_start_date
        description: Identifies the earliest site value within a group, typically used as a proxy for the start date in site-based inventory analysis. Use when questions ask about 'start date', 'earliest site', or 'beginning of inventory period' for each site. Helps establish the timeframe for inventory reporting, enabling users to understand the period covered by inventory value or other site-based metrics.
        expr: MIN(site)
  - name: FACT_PURCHASING_REPORT_COPY
    synonyms:
      - Procurement Data
      - Procurement Report
      - Procurement Summary
      - Purchase Order Analysis
      - Purchase Order Details
      - Purchase Order Report
      - Purchasing Data
      - Purchasing Report
      - Purchasing Summary
    description: The table contains records of purchasing activities, specifically details about orders and deliveries. Each record represents a single purchase order line item and includes information about the vendor, item, and logistics, as well as dates and codes related to the purchasing process.
    base_table:
      database: DEV_ANALYTICS_TW
      schema: DEV_ANALYTICS_SCHEMA
      table: FACT_PURCHASING_REPORT_COPY
    dimensions:
      - name: BUYER
        synonyms:
          - acquirer
          - client
          - customer
          - procurer
          - purchaser
        description: The name of the person or entity making the purchase.
        expr: '"Buyer"'
        data_type: VARCHAR(16777216)
        sample_values:
          - BESTER
          - Kevin Struillou
          - d.burton@mhmautomation.com
      - name: COST_CODE_DESC
        synonyms:
          - _center_description
          - cost_account_description
          - expense_category_description
          - expense_code_description
          - financial_code_description
        description: A description of a cost code.
        expr: '"Cost Code - Desc"'
        data_type: VARCHAR(16777216)
        sample_values:
          - 9361 - WIPASS
          - 9355 - 9355
          - 2025 - 4259
      - name: CURRENCY_CODE
        synonyms:
          - currency
          - currency_symbol
          - currency_type
          - exchange_rate
          - exchange_unit
          - iso_code
          - monetary_unit
          - money_type
        description: The three-character code representing the currency in which a transaction was made.
        expr: '"Currency Code"'
        data_type: VARCHAR(16777216)
        sample_values:
          - NZD
          - CAD
          - DKK
      - name: DATE_SEQ
        synonyms:
          - date_id
          - date_index
          - date_number
          - date_order
          - date_sequence
          - sequence_date
          - sequence_number
        description: A sequential identifier for dates.
        expr: '"Date Seq"'
        data_type: NUMBER(18,0)
        sample_values:
          - '35'
          - '2'
          - '3'
      - name: DELIVERY_TIME_DAYS
        synonyms:
          - days_to_deliver
          - delivery_duration
          - delivery_lead_time
          - lead_time
          - shipping_days
          - shipping_duration
          - transit_time
        description: The number of days required to deliver an item.
        expr: '"Delivery Time (days)"'
        data_type: NUMBER(9,0)
        sample_values:
          - '15'
          - '21'
          - '261'
      - name: DESTINATION_DETAILS
        synonyms:
          - consignee_details
          - delivery_address
          - delivery_location
          - destination_info
          - drop_off_point
          - receiving_address
          - receiving_location
          - shipment_details
        description: Details about the destination of a purchase or shipment.
        expr: '"Destination Details"'
        data_type: VARCHAR(16777216)
        sample_values:
          - PO120909
          - '1100420744'
          - '92956'
      - name: DESTINATION_TYPE
        synonyms:
          - delivery_address
          - delivery_location
          - delivery_point
          - drop_off_point
          - receiving_location
          - receiving_point
          - shipment_address
          - shipment_destination
        description: The type of destination for a purchase order.
        expr: '"Destination Type"'
        data_type: VARCHAR(16777216)
        sample_values:
          - Order - Line - Rel
      - name: DUE_DATE
        synonyms:
          - deadline
          - delivery_due_date
          - expected_completion_date
          - planned_delivery_date
          - required_by_date
          - scheduled_date
          - target_date
        description: The date by which payment is due.
        expr: CAST(TRY_TO_TIMESTAMP(NULLIF("Due Date", ''),'DD-MM-YYYY') AS DATE)
        data_type: VARCHAR(16777216)
        sample_values:
          - '2025-06-04'
          - '2026-02-23'
          - '2025-12-17'
        is_enum: false
      - name: ITEM
        synonyms:
          - article
          - asset
          - commodity
          - goods
          - inventory
          - material
          - merchandise
          - object
          - stock
        description: A unique identifier for a purchased item.
        expr: '"Item"'
        data_type: VARCHAR(16777216)
        sample_values:
          - '4001098260'
          - 004367-A
          - 1-040253
      - name: ITEM_DESCRIPTION
        synonyms:
          - item_characteristics
          - item_details
          - item_info_description
          - item_specification
          - product_characteristics
          - product_info
          - product_specification
        description: A brief description of the item being purchased.
        expr: '"Item Description"'
        data_type: VARCHAR(16777216)
        sample_values:
