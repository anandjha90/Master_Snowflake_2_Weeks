        expr: '"Release Date"'
        data_type: DATE
    facts:
      - name: PURCHASE_VALUE
        synonyms:
          - acquisition_cost
          - expenditure_value
          - procurement_value
          - purchase_amount
          - total_cost
          - total_spent
