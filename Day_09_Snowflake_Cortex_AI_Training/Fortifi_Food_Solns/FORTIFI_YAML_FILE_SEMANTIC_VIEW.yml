        expr: CAST(TRY_TO_TIMESTAMP(NULLIF("Order Date", ''),'DD-MM-YYYY') AS DATE)
        data_type: VARCHAR(16777216)
        sample_values:
          - '2025-12-05'
          - '2024-12-16'
          - '2025-12-19'
        is_enum: false
      - name: PLANNER_CODE_DESC
        synonyms:
          - planner_description
          - planner_name
          - planning_code_description
          - planning_code_name
          - procurement_code_description
          - procurement_code_name
          - purchasing_code_description
          - purchasing_code_name
